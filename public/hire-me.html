<!DOCTYPE html><html lang="en"><head><title>Hire Me</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="/css/styles.css"></head>
<body data-page="hire" data-title="Hire Me">
<div id="site-header"></div>
<main>
  <section class="page-hero"><div class="container"><h1>Hire Me</h1><p>Tell me about your project or opportunity.</p></div></section>
  <section class="section"><div class="container split">
    <div class="hire-left">
    <div class="card why-card">
      <h2>Why hire me</h2>
      <ul class="why-list" id="why-list"></ul>
    </div>
    <div class="card contact-info">
      <h2>Get in touch</h2>
      <ul class="contact-list">
        <li><i class="fa-solid fa-phone"></i> <a id="c-phone" href="#"></a></li>
        <li><i class="fa-solid fa-envelope"></i> <a id="c-email" href="#"></a></li>
        <li><i class="fa-solid fa-location-dot"></i> <span id="c-location"></span></li>
      </ul>
      <h3>Availability</h3>
      <p id="c-availability"></p>
    </div>
    </div>
    <form class="card form" id="contact-form" novalidate>
      <h2>Send a message</h2>
      <label>Your name<input name="name" required autocomplete="name"></label>
      <label>Email address<input name="email" type="email" required autocomplete="email"></label>
      <label>Subject<input name="subject"></label>
      <label>Message<textarea name="message" rows="6" required></textarea></label>
      <button class="btn btn-red" type="submit">Send message</button>
      <p class="form-status" id="form-status" role="status"></p>
    </form>
  </div></section>
</main>
<div id="site-footer"></div>
<script src="/js/store.js"></script><script src="/js/layout.js"></script><script src="/js/pages.js"></script>
</body></html>
